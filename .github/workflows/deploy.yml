name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGISTRY: gcr.io
  IMAGE_NAME: chunav-sathi
  REGION: us-central1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account_email: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication to GCR
        run: |
          gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }} \
            -t $REGISTRY/$PROJECT_ID/$IMAGE_NAME:latest \
            .

      - name: Push image to Google Container Registry
        run: |
          docker push $REGISTRY/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }}
          docker push $REGISTRY/$PROJECT_ID/$IMAGE_NAME:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $IMAGE_NAME \
            --image=$REGISTRY/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }} \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --set-env-vars="ENVIRONMENT=production"

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe $IMAGE_NAME --region=$REGION --format='value(status.url)')
          echo "Deployment successful! Service URL: $URL"

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: failure()
    
    steps:
      - name: Notify failure
        run: |
          echo "❌ Deployment failed!"
          echo "Check the GitHub Actions logs for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
