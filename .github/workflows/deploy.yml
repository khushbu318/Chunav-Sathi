name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: chunav-sathi
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account_email: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Debug identity
        run: |
          gcloud auth list
          gcloud config list

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set project ID
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run (from source)
        run: |
          gcloud run deploy chunav-sathi \
            --source=. \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --quiet

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe chunav-sathi --region=us-central1 --project=${{ secrets.GCP_PROJECT_ID }} --format='value(status.url)')
          echo "✅ Deployment successful!"
          echo "Service URL: $URL"
