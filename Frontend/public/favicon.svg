    <line x1="35" y1="23.2" x2="33.9" y2="26"/>
    <line x1="40.8" y1="29" x2="38" y2="30.1"/>
    <line x1="40.8" y1="35" x2="38" y2="33.9"/>
    <line x1="35" y1="40.8" x2="33.9" y2="38"/>
    <line x1="29" y1="40.8" x2="30.1" y2="38"/>
